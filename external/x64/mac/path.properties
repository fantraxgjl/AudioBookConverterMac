# macOS tool paths for AudioBookConverter
#
# Apple Silicon Macs (M1/M2/M3): Homebrew installs to /opt/homebrew/bin/
# Intel Macs:                     Homebrew installs to /usr/local/bin/
#
# If you are on an Intel Mac, change the paths below to use /usr/local/bin/
# Alternatively, place a custom path.properties in ~/.abc/6.3.0-SNAPSHOT/
# (the APP_HOME directory) to override these defaults without editing this file.
#
# Required Homebrew packages:
#   brew install ffmpeg mp4v2
# (mp4v2 provides mp4art and mp4info)

ffmpeg=/opt/homebrew/bin/ffmpeg
ffprobe=/opt/homebrew/bin/ffprobe
mp4art=/opt/homebrew/bin/mp4art
mp4info=/opt/homebrew/bin/mp4info
platform=macos
